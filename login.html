<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Tres Reyes Panadería</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: #fdfbf7; }
        .login-wrapper { display: flex; justify-content: center; align-items: center; flex: 1; padding: 20px; }
        .login-container { max-width: 400px; width: 100%; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        .login-container h2 { margin-bottom: 10px; color: #333; }
        .login-form input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        .login-form button { width: 100%; padding: 15px; background-color: #d4a373; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .error-msg, .success-msg { margin-bottom: 15px; display: none; font-size: 14px; font-weight: bold; padding: 10px; border-radius: 5px; }
        .error-msg { background: #f8d7da; color: #721c24; }
        .success-msg { background: #d4edda; color: #155724; }
        .toggle-link { color: #d4a373; cursor: pointer; font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">Tres Reyes Panadería</div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="pedidos.html">Pedidos</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-wrapper">
        <div class="login-container">
            
            <div id="panel-login">
                <h2>Acceso al Sistema</h2>
                <p style="color: #666; margin-bottom: 20px;">Ingresa tus credenciales</p>
                <div id="error-login" class="error-msg">Usuario o contraseña incorrectos</div>
                
                <form id="form-login" class="login-form">
                    <input type="text" id="log-usu" placeholder="Usuario" required>
                    <input type="password" id="log-pas" placeholder="Contraseña" required>
                    <button type="submit">Entrar</button>
                    <p>¿No tienes cuenta? <span class="toggle-link" onclick="toggleForms()">Crea una aquí</span></p>
                </form>
            </div>

            <div id="panel-registro" style="display: none;">
                <h2>Nueva Cuenta</h2>
                <p style="color: #666; margin-bottom: 20px;">Regístrate como cliente</p>
                <div id="error-reg" class="error-msg">El usuario ya existe</div>
                <div id="success-reg" class="success-msg">¡Cuenta creada! Ya puedes iniciar sesión.</div>
                
                <form id="form-registro" class="login-form">
                    <input type="text" id="reg-usu" placeholder="Elige un usuario" required>
                    <input type="password" id="reg-pas" placeholder="Crea una contraseña" required>
                    <button type="submit">Registrarse</button>
                    <p>¿Ya tienes cuenta? <span class="toggle-link" onclick="toggleForms()">Inicia sesión</span></p>
                </form>
            </div>

        </div>
    </div>

    <script>
        // Inicializar administrador si la base de datos está vacía
        let usuariosDB = JSON.parse(localStorage.getItem('usuariosDB')) || [];
        if (usuariosDB.length === 0) {
            usuariosDB.push({ usuario: 'admin', password: '12345', rol: 'admin' });
            localStorage.setItem('usuariosDB', JSON.stringify(usuariosDB));
        }

        function toggleForms() {
            let login = document.getElementById('panel-login');
            let reg = document.getElementById('panel-registro');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                reg.style.display = 'none';
            } else {
                login.style.display = 'none';
                reg.style.display = 'block';
            }
        }

        // Procesar Registo
        document.getElementById('form-registro').addEventListener('submit', function(e) {
            e.preventDefault();
            let u = document.getElementById('reg-usu').value;
            let p = document.getElementById('reg-pas').value;
            let db = JSON.parse(localStorage.getItem('usuariosDB')) || [];
            
            if(db.find(user => user.usuario === u)) {
                document.getElementById('error-reg').style.display = 'block';
                document.getElementById('success-reg').style.display = 'none';
            } else {
                db.push({ usuario: u, password: p, rol: 'cliente' });
                localStorage.setItem('usuariosDB', JSON.stringify(db));
                document.getElementById('error-reg').style.display = 'none';
                document.getElementById('success-reg').style.display = 'block';
                document.getElementById('form-registro').reset();
            }
        });

        // Procesar Login
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            let u = document.getElementById('log-usu').value;
            let p = document.getElementById('log-pas').value;
            let db = JSON.parse(localStorage.getItem('usuariosDB')) || [];

            let encontrado = db.find(user => user.usuario === u && user.password === p);

            if(encontrado) {
                sessionStorage.setItem('logeado', 'true');
                sessionStorage.setItem('rol', encontrado.rol);
                sessionStorage.setItem('usuarioActivo', encontrado.usuario);
                
                if(encontrado.rol === 'admin' || encontrado.rol === 'repartidor') {
                    window.location.href = 'panel.html';
                } else {
                    window.location.href = 'pedidos.html';
                }
            } else {
                document.getElementById('error-login').style.display = 'block';
            }
        });
    </script>
</body>
</html>
