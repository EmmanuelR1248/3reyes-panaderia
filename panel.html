<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - 3Reyes Panadería</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e0d8d0; }
        .admin-table th { background-color: #fcfaf8; color: #c68e58; font-weight: bold; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-pendiente { background-color: #fff3cd; color: #856404; }
        .status-entregado { background-color: #d4edda; color: #155724; }
        .btn-small { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 12px; margin-right: 5px; }
        .btn-entregar { background-color: #28a745; }
        .btn-eliminar { background-color: #dc3545; }
        .btn-rol { background-color: #c68e58; }
        .panel-section { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 40px; overflow-x: auto;}
    </style>
    <script>
        let rol = sessionStorage.getItem('rol');
        if(sessionStorage.getItem('logeado') !== 'true' || rol === 'cliente') {
            window.location.href = 'login.html'; // Evita que clientes entren aquí
        }
    </script>
</head>
<body>
    <header class="navbar">
        <div class="logo">3Reyes - Panel (<span id="user-role"></span>)</div>
        <nav>
            <ul>
                <li><a href="index.html">Ir a Tienda</a></li>
                <li><a href="#" id="btn-cerrar-sesion" style="color: #dc3545; font-weight: bold;">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content" style="max-width: 1400px;">
        
        <h2 class="page-title" style="text-align: left; font-size: 24px;">Pedidos Activos</h2>
        <div class="panel-section">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Fecha/Hora</th>
                        <th>Cliente</th>
                        <th>Dirección</th>
                        <th>Pedido</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-pedidos"></tbody>
            </table>
        </div>

        <div id="seccion-usuarios" style="display: none;">
            <h2 class="page-title" style="text-align: left; font-size: 24px;">Gestión de Usuarios</h2>
            <div class="panel-section">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Rol Actual</th>
                            <th>Cambiar Rol</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('user-role').textContent = sessionStorage.getItem('usuarioActivo');
        
        document.getElementById('btn-cerrar-sesion').addEventListener('click', function() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        });

        function cargarPedidos() {
            let pedidos = JSON.parse(localStorage.getItem('pedidos')) || [];
            let cuerpo = document.getElementById('tabla-pedidos');
            cuerpo.innerHTML = '';
            let rolActual = sessionStorage.getItem('rol');

            pedidos.reverse().forEach(function(pedido) {
                let tr = document.createElement('tr');
                let claseEstado = pedido.estado === 'Entregado' ? 'status-entregado' : 'status-pendiente';
                let botonesAccion = '';
                
                if(pedido.estado !== 'Entregado') {
                    botonesAccion += `<button class="btn-small btn-entregar" onclick="cambiarEstado(${pedido.id}, 'Entregado')">Marcar Entregado</button>`;
                }
                if(rolActual === 'admin') {
                    botonesAccion += `<button class="btn-small btn-eliminar" onclick="eliminarPedido(${pedido.id})">Eliminar</button>`;
                }

                tr.innerHTML = `
                    <td>${pedido.fecha}</td>
                    <td><strong>${pedido.nombre}</strong></td>
                    <td>${pedido.direccion}</td>
                    <td><strong>${pedido.producto}</strong></td>
                    <td><span class="status-badge ${claseEstado}">${pedido.estado}</span></td>
                    <td>${botonesAccion}</td>
                `;
                cuerpo.appendChild(tr);
            });
        }

        function cargarUsuarios() {
            if(sessionStorage.getItem('rol') !== 'admin') return;
            document.getElementById('seccion-usuarios').style.display = 'block';

            let usuarios = JSON.parse(localStorage.getItem('usuariosDB')) || [];
            let cuerpo = document.getElementById('tabla-usuarios');
            cuerpo.innerHTML = '';

            usuarios.forEach(function(u) {
                if(u.usuario === 'admin') return; // Evitar que el admin se cambie a sí mismo
                
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.usuario}</td>
                    <td><strong>${u.rol.toUpperCase()}</strong></td>
                    <td>
                        <select id="rol-${u.usuario}" style="padding: 5px;">
                            <option value="cliente" ${u.rol==='cliente'?'selected':''}>Cliente</option>
                            <option value="repartidor" ${u.rol==='repartidor'?'selected':''}>Repartidor</option>
                            <option value="admin" ${u.rol==='admin'?'selected':''}>Administrador</option>
                        </select>
                        <button class="btn-small btn-rol" onclick="cambiarRol('${u.usuario}')">Actualizar Rol</button>
                    </td>
                `;
                cuerpo.appendChild(tr);
            });
        }

        function cambiarEstado(id, nuevoEstado) {
            let pedidos = JSON.parse(localStorage.getItem('pedidos')) || [];
            pedidos = pedidos.map(p => { if (p.id === id) p.estado = nuevoEstado; return p; });
            localStorage.setItem('pedidos', JSON.stringify(pedidos));
            cargarPedidos();
        }

        function eliminarPedido(id) {
            if(confirm('¿Seguro que deseas eliminar este pedido?')) {
                let pedidos = JSON.parse(localStorage.getItem('pedidos')) || [];
                pedidos = pedidos.filter(p => p.id !== id);
                localStorage.setItem('pedidos', JSON.stringify(pedidos));
                cargarPedidos();
            }
        }

        function cambiarRol(usuario) {
            let nuevoRol = document.getElementById(`rol-${usuario}`).value;
            let usuarios = JSON.parse(localStorage.getItem('usuariosDB')) || [];
            usuarios = usuarios.map(u => { if (u.usuario === usuario) u.rol = nuevoRol; return u; });
            localStorage.setItem('usuariosDB', JSON.stringify(usuarios));
            alert('Rol actualizado exitosamente');
            cargarUsuarios();
        }

        window.onload = function() {
            cargarPedidos();
            cargarUsuarios();
        };
    </script>
</body>
</html>
